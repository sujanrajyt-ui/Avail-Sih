services:
  - type: web
    name: avail-sih26027
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/system-info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11